<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0284c7">
    <meta name="description" content="Trang không tồn tại — quay lại portfolio của Nguyễn Thành Luân.">
    <meta name="robots" content="noindex">
    <title>Không tìm thấy trang - Nguyễn Thành Luân</title>
    <link rel="icon" type="image/png" href="/portfolio-thanhluan/assets/madao-logo.png">
    <style>
        :root { --brand: #0284c7; --accent: #38bdf8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
            font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; color: #1e354d;
            background: radial-gradient(circle at 50% -12%, #e0f2fe, transparent 34rem), #f5f9ff; }
        .box { max-width: 460px; background: #fff; border: 1px solid #dbeafe; border-radius: 22px; padding: 44px 32px;
            box-shadow: 0 4px 10px rgba(12,74,130,.045), 0 20px 44px rgba(14,116,184,.12); }
        h1 { font-size: 72px; line-height: 1; background: linear-gradient(135deg, var(--brand), var(--accent));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { margin: 12px 0 8px; color: #0b1f33; }
        p { color: #5a728a; margin-bottom: 24px; line-height: 1.6; }
        a { display: inline-block; padding: 12px 26px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600;
            background: linear-gradient(135deg, var(--brand), var(--accent)); }
    </style>
</head>
<body>
    <main class="box">
        <h1>404</h1>
        <h2>Không tìm thấy trang</h2>
        <p>Đường dẫn bạn truy cập không tồn tại hoặc đã được di chuyển.</p>
        <a href="/portfolio-thanhluan/">Về trang chủ</a>
    </main>
</body>
</html>
